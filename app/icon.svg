      <stop offset="0" stop-color="#0EA5E9" />
      <stop offset="1" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="28" height="28" rx="9" fill="url(#teamhub-favicon)" />

  <!-- left person -->
  <circle cx="9.8" cy="12.8" r="2" fill="#FFFFFF" />
