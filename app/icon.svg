<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Sameward mark — favicon / app icon keeps the tile so it holds up in a tab -->
  <defs>
    <linearGradient id="teamhub-favicon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9" />
      <stop offset="1" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="teamhub-favicon-sheen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="28" height="28" rx="9" fill="url(#teamhub-favicon)" />
  <rect x="2" y="2" width="28" height="28" rx="9" fill="url(#teamhub-favicon-sheen)" />

  <!-- two wings travelling the same way -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linejoin="round">
    <path d="M11.5 8.5 24 16 11.5 23.5 15.8 16Z" stroke-width="1.9" />
    <path d="M6.5 11.5 12 16 6.5 20.5 8.6 16Z" stroke-width="1.3" opacity="0.45" />
  </g>
</svg>
