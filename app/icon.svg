  />
  <!-- center person + stem -->
  <circle cx="16" cy="11.6" r="2.4" fill="#FFFFFF" />
  <path
    fill="#FFFFFF"
    d="M11.8 21c0-2.3 1.9-3.85 4.2-3.85S20.2 18.7 20.2 21v.4h-8.4V21Z"
